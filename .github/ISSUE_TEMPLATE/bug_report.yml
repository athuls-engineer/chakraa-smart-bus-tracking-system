name: Bug Report
description: Create a report to help us improve the Chakraa IoT Transit Platform
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue in the Chakraa transit tracking system!
  - type: input
    id: component
    attributes:
      label: Component Affected
      description: Which part of the system is affected? (Firmware / Server / Driver App / User App)
      placeholder: e.g., Firmware ESP32 Neo-6M GPS parser
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug with steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
